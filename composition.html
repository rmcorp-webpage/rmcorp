        <div class="slideshow"
        data-description="
        8 Ball Community Almanac<br><br>
        This book was made to serve as a retrospective archive of the last 10 years of 8 Ball Community.<br><br>
        Inspired by the Audubon Society field guides, the layout emphasis utility while having the organization of the grid broken at times with hand-set latraset type (inspired by the DIY nature of zines and self-publishing) and illustrated elements overlayed. The illustrated elements and colors are used to identify which section/ facet of 8 Ball you’re looking at, as- signed by each color of billiard balls. All scanned elements in the book are floating while images have an outline, emphasizing the ephemeral nature
        of the objects themselves and of the organization as a whole.<br><br>
        The book is separated into two main parts,the white pages are the written section, the black pages are the visual section.<br><br>
        20x30cm<br>
        Perfect bound softcover with PVC embossed dust jacket<br>
        300 pages<br>
        Published by Nero Editions
        ">
