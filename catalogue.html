<style>
.sidebar{
    position:fixed;
    left:0;
    top:0;
    width:200px;
    height:100vh;
    padding:10px;
}

.logo{
    margin-bottom:5px;
}

.logo svg{
    width:100px;
    height:auto;
    display:block;
}

nav{
    margin-top:0;
}

.content{
    margin-left:200px;
    margin-top:25px;
    padding:10px;
}

.project{
    margin-bottom:80px;
}

.catalogue-wrap{
    width:1000px;
    max-width:100%;
    font-family:Helvetica, Arial, sans-serif;
    font-size:10px;
}

.catalogue-top{
    display:grid;
    grid-template-columns:12.5% 25% 12.5% 12.5% 12.5% 12.5% 12.5%;
    align-items:end;
    margin-bottom:6px;
}

.catalogue-search{
    grid-column:1 / span 5;
    width:100%;
    box-sizing:border-box;
    font-family:Helvetica, Arial, sans-serif;
    font-size:10px;
}

.updated-label{
    grid-column:6;
    padding-left:8px;
}

.updated-date{
    grid-column:7;
    padding-left:8px;
}

.catalogue-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
    font-family:Helvetica, Arial, sans-serif;
    font-size:10px;
}

.catalogue-table thead tr{
    border-bottom:1px solid #000;
}

.catalogue-table th,
.catalogue-table td{
    padding:4px 8px;
    text-align:left;
    vertical-align:top;
    font-weight:normal;
}

@media (max-width:800px){

    .sidebar{
        position:relative;
        width:auto;
        height:auto;
    }

    .content{
        margin-left:0;
        margin-top:0;
        padding:10px;
        max-width:100%;
        overflow-x:hidden;
    }

    .catalogue-wrap{
        width:100%;
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
    }

    .catalogue-top{
        display:grid;
        grid-template-columns:220px auto auto;
        min-width:900px;
        gap:8px;
        margin-bottom:6px;
    }

    .catalogue-search{
        grid-column:1;
        width:220px;
    }

    .updated-label{
        grid-column:2;
    }

    .updated-date{
        grid-column:3;
    }

    .catalogue-table{
        min-width:900px;
    }
}
</style>

const rows = document.getElementById('rows');
const search = document.getElementById('search');

function render(list) {
  rows.innerHTML = '';

  list.forEach(i => {
    rows.innerHTML += `
      <tr>
        <td style="width:12.5%">${i.id}</td>
        <td style="width:25%">${i.title}</td>
        <td style="width:12.5%">${i.notes}</td>
        <td style="width:12.5%">${i.material}</td>

        <td style="width:12.5%">${i.edition}</td>
        <td style="width:12.5%">${i.date}</td>
      </tr>
    `;
  });
}

render(items);

search.addEventListener('input', e => {
  const q = e.target.value.toLowerCase();

  const filtered = items.filter(i =>
    Object.values(i).join(' ').toLowerCase().includes(q)
  );

  render(filtered);
});
